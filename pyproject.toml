[project]
name = "indian-pharma-rag"
version = "0.1.0"
description = "Hybrid RAG service for Indian generic medicine substitutions"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.1",
    "fastembed==0.8.0",
    "httpx==0.28.1",
    "pydantic-settings==2.10.1",
    "pdfplumber==0.11.7",
    "pypdf==6.0.0",
    "supabase==2.18.1",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "ruff==0.12.9",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "ruff==0.12.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
