<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indian Medicine Source Lookup</title>
  <style>
    :root {
      --ink: #182126;
      --muted: #647278;
      --paper: #f6f5ef;
      --panel: #fffef9;
      --line: #d8ded8;
      --teal: #087f78;
      --teal-dark: #075b58;
      --coral: #d7684f;
      --shadow: 0 18px 50px rgba(24, 33, 38, .10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: radial-gradient(circle at 85% 8%, #d9eee7 0, transparent 30%), var(--paper);
      font: 16px/1.55 Georgia, 'Times New Roman', serif;
    }
    .shell { width: min(1080px, calc(100% - 32px)); margin: 0 auto; }
    header { padding: 42px 0 30px; display: flex; justify-content: space-between; gap: 24px; align-items: end; }
    .kicker { color: var(--coral); font: 700 12px/1.2 'Trebuchet MS', sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    h1 { max-width: 680px; margin: 10px 0 0; font-size: clamp(2.4rem, 6vw, 5.2rem); line-height: .98; font-weight: 400; letter-spacing: 0; }
    .badge { border: 1px solid var(--line); border-radius: 999px; padding: 8px 13px; color: var(--teal-dark); background: rgba(255,254,249,.7); font: 700 12px 'Trebuchet MS', sans-serif; white-space: nowrap; }
    main { padding-bottom: 56px; }
    .search-panel { padding: 24px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
    label { display: block; margin-bottom: 9px; color: var(--muted); font: 700 13px 'Trebuchet MS', sans-serif; text-transform: uppercase; letter-spacing: .08em; }
    .search-row { display: flex; gap: 12px; }
    input { min-width: 0; flex: 1; border: 1px solid #b9c8c2; border-radius: 5px; padding: 14px 15px; color: var(--ink); background: #fff; font: 18px Georgia, serif; }
    input:focus { outline: 3px solid rgba(8,127,120,.18); border-color: var(--teal); }
    button { border: 0; border-radius: 5px; padding: 0 22px; color: white; background: var(--teal); cursor: pointer; font: 700 15px 'Trebuchet MS', sans-serif; }
    button:hover { background: var(--teal-dark); }
    button:disabled { opacity: .55; cursor: wait; }
    .status { min-height: 27px; margin: 14px 0 0; color: var(--muted); font-family: 'Trebuchet MS', sans-serif; font-size: 13px; }
    .status.error { color: #a63e31; }
    .answer { display: none; margin-top: 34px; }
    .answer.visible { display: block; }
    .answer-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; border-bottom: 2px solid var(--ink); padding-bottom: 10px; }
    h2 { margin: 0; font-size: 28px; font-weight: 400; }
    .confidence { color: var(--teal-dark); font: 700 13px 'Trebuchet MS', sans-serif; }
    .answer-copy { white-space: pre-line; max-width: 850px; margin: 22px 0; font-size: 19px; }
    .sources { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
    .source { padding: 17px; border-top: 4px solid var(--coral); background: var(--panel); box-shadow: 0 8px 24px rgba(24,33,38,.06); }
    .source-title { margin: 0 0 8px; font-size: 18px; }
    .source-meta { margin: 0; color: var(--muted); font: 13px/1.5 'Trebuchet MS', sans-serif; }
    .source-text { margin: 12px 0 0; font-size: 14px; }
    footer { color: var(--muted); font: 12px 'Trebuchet MS', sans-serif; }
    @media (max-width: 620px) {
      header { display: block; padding-top: 28px; }
      .badge { display: inline-block; margin-top: 20px; }
      .search-row { display: block; }
      button { width: 100%; min-height: 48px; margin-top: 10px; }
      .search-panel { padding: 18px; }
      .answer-heading { display: block; }
      .confidence { display: block; margin-top: 8px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <div class="kicker">Evidence-led medicine lookup</div>
        <h1>Look up Indian medicine source records.</h1>
      </div>
      <div class="badge">Hybrid RAG · India</div>
    </header>
    <main>
      <section class="search-panel" aria-label="Medicine search">
        <form id="query-form">
          <label for="query">Search a product, drug name, banned entry, or Kendra</label>
          <div class="search-row">
            <input id="query" name="query" type="search" maxlength="500" placeholder="e.g. Paracetamol 500mg tablets" required autocomplete="off">
            <button id="submit" type="submit">Search records</button>
          </div>
          <div id="status" class="status" role="status" aria-live="polite"></div>
        </form>
      </section>
      <section id="answer" class="answer" aria-live="polite">
        <div class="answer-heading">
          <h2>Answer</h2>
          <div id="result-count" class="confidence"></div>
        </div>
        <p id="answer-copy" class="answer-copy"></p>
        <div id="sources" class="sources"></div>
      </section>
    </main>
    <footer>Catalog and document extracts may be outdated or imperfect. This demo cannot determine suitable substitutes, doses, or treatment. Verify current facts with a pharmacist or doctor.</footer>
  </div>
  <script>
    const form = document.getElementById('query-form');
    const input = document.getElementById('query');
    const button = document.getElementById('submit');
    const status = document.getElementById('status');
    const answer = document.getElementById('answer');
    const answerCopy = document.getElementById('answer-copy');
    const resultCount = document.getElementById('result-count');
    const sources = document.getElementById('sources');

    const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (character) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[character]));

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const query = input.value.trim();
      if (!query) return;
      button.disabled = true;
      status.className = 'status';
      status.textContent = 'Searching dense and lexical records...';
      answer.classList.remove('visible');
      try {
        const response = await fetch('/api/v1/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'The query could not be completed.');
        answerCopy.textContent = data.answer;
        resultCount.textContent = data.sources.length ? '1 supporting source' : 'No supporting source';
        sources.innerHTML = data.sources.map((source) => {
          const metadata = source.metadata || {};
          return `<article class="source">
            <h3 class="source-title">${escapeHtml(metadata.source_document || 'Source record')}</h3>
            <p class="source-meta">Source ID: ${escapeHtml(source.source_id)}${metadata.page_number ? ` · page ${escapeHtml(metadata.page_number)}` : ''}</p>
            <p class="source-text">${escapeHtml(source.content)}</p>
            <p class="source-meta">${metadata.catalog_import_date ? `Catalog imported: ${escapeHtml(metadata.catalog_import_date)} · source update date unverified` : ''}${metadata.source_url ? `<br><a href="${escapeHtml(metadata.source_url)}" target="_blank" rel="noopener noreferrer">Source link</a>` : ''}</p>
          </article>`;
        }).join('');
        status.textContent = 'Completed';
        answer.classList.add('visible');
      } catch (error) {
        status.className = 'status error';
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
